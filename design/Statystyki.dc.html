<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FFFFFF;font-family:'Figtree',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#17201C;box-sizing:border-box">

  <div style="background:#E3EDE8;border-radius:0 0 32px 32px;padding:44px 20px 24px">

      <a href="Main.dc.html" aria-label="Wróć" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"/></svg></a>
      <div style="font-weight:700;font-size:18px">Statystyki, ostatnie 7 dni</div>
    </header>
    <div style="margin-top:12px;display:flex;align-items:baseline;gap:10px">
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:72px;line-height:72px;letter-spacing:-0.02em">532</span>
      <span style="font-size:17px;font-weight:600">kcal dziennie</span>
    </div>
    <div style="margin-top:6px;font-size:15px;line-height:22px;color:#3A463F">Średnia z dni, w których coś zapisałeś (1 z 7).</div>

  <div style="padding:24px 20px 0">

      <div style="position:absolute;right:0;top:6px;font-size:13px;font-weight:600;color:#3A463F">cel 2000</div>
      <div style="position:absolute;left:0;right:0;bottom:28px;top:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end">
        <div style="height:6px;border-radius:3px;background:#E1E6E3;margin:0 8px"></div>
        <div style="height:6px;border-radius:3px;background:#E1E6E3;margin:0 8px"></div>
        <div style="height:6px;border-radius:3px;background:#E1E6E3;margin:0 8px"></div>
        <div style="height:6px;border-radius:3px;background:#E1E6E3;margin:0 8px"></div>
        <div style="height:6px;border-radius:3px;background:#E1E6E3;margin:0 8px"></div>
        <div style="height:6px;border-radius:3px;background:#E1E6E3;margin:0 8px"></div>
        <div style="height:27%;border-radius:8px 8px 4px 4px;background:#1F5F4A;margin:0 4px"></div>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:24px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;text-align:center;font-size:13px;color:#566059">
        <span>pon.</span><span>wt.</span><span>śr.</span><span>czw.</span><span>pt.</span><span>sob.</span><span style="font-weight:700;color:#12392C">dziś</span>
      </div>
    </div>

    <div style="margin-top:28px;font-size:18px;font-weight:700">Makro w dni z wpisem</div>
    <div style="margin-top:8px;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #E1E6E3">
        <div style="width:72px;font-size:16px;font-weight:600">Białko</div>
        <div style="flex:1;height:8px;border-radius:4px;background:#E1E6E3"><div style="width:26%;height:8px;border-radius:4px;background:#2B4BC9"></div></div>
        <div style="width:96px;text-align:right;font-size:15px">31 / 120 g</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #E1E6E3">
        <div style="width:72px;font-size:16px;font-weight:600">Węgle</div>
        <div style="flex:1;height:8px;border-radius:4px;background:#E1E6E3"><div style="width:19%;height:8px;border-radius:4px;background:#B56A0A"></div></div>
        <div style="width:96px;text-align:right;font-size:15px">41 / 220 g</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #E1E6E3;border-bottom:1px solid #E1E6E3">
        <div style="width:72px;font-size:16px;font-weight:600">Tłuszcz</div>
        <div style="flex:1;height:8px;border-radius:4px;background:#E1E6E3"><div style="width:40%;height:8px;border-radius:4px;background:#B04A35"></div></div>
        <div style="width:96px;text-align:right;font-size:15px">26 / 65 g</div>
      </div>
    </div>

    <div style="margin-top:24px;font-size:16px;line-height:24px;color:#3A463F">Masz 1 z 7 dni. Każdy wpis się liczy, a puste dni nie psują średniej.</div>
  </div>
</div>
